---
# file: docker-compose.yml
version: '3.7'
services:

  reciplease:
    build:
      context: .
      dockerfile: Dockerfile
    image: reciplease:latest
    container_name: reciplease_${PORT-4000}
    ports:
      - ${PORT-4000}:${SERVER_PORT-4000}
    environment:
      - PORT=${PORT-4000}
      - SERVER_PORT=${SERVER_PORT-4000}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      # The app uses MongoDB Atlas; the URI is injected via SPRING_MONGODB_URI.
      - SPRING_MONGODB_URI=${SPRING_MONGODB_URI}
    # volumes:
    #   - ./instances/reciplease:/opt/reciplease
    restart: unless-stopped
    stdin_open: true
    tty: true