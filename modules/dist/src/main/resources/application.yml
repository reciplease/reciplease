reciplease:
  jwt:
    # Fake, non-secret default so local/dev runs work without setting an env var.
    # NEVER use this value outside local development.
    signing-secret: local-dev-only-secret-do-not-use-in-prod
  webauthn:
    rp-id: localhost
    rp-name: Reciplease
    allowed-origins: http://localhost:3000
  fitbit:
    # Fake, non-secret defaults so local/dev runs boot without a real Fitbit app registered.
    # NEVER use these values outside local development.
    client-id: local-dev-only-fitbit-client-id
    client-secret: local-dev-only-fitbit-client-secret
    redirect-uri: http://localhost:3000/api/fitbit/callback

springdoc:
  swagger-ui:
    path: /
  default-produces-media-type: application/json
  api-docs:
    path: /openapi

server:
  # Honour X-Forwarded-* (in particular X-Forwarded-Prefix) so that, when the
  # Reciplease web app reverse-proxies Swagger UI under /swagger, SpringDoc emits
  # its asset, spec and "Try it out" server URLs under that prefix.
  forward-headers-strategy: framework

spring:
  jackson:
    default-property-inclusion: non_null
  cloud:
    gcp:
      core:
        enabled: false
      secretmanager:
        enabled: false