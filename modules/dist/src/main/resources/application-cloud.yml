spring:
  cloud:
    gcp:
      core:
        enabled: true
      secretmanager:
        enabled: false
  data:
    mongodb:
      # Spring Boot 4 + spring-cloud-gcp 8.x has a bug where ${sm://...} placeholders
      # fail to bind to this property. Use env vars instead: gcloud run deploy
      # --set-secrets SPRING_DATA_MONGODB_URI=reciplease-database-url:latest mounts
      # the secret value directly.
      uri: ${SPRING_DATA_MONGODB_URI}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Google's OIDC issuer; Spring fetches its public keys to validate tokens.
          issuer-uri: https://accounts.google.com
          # Tokens must be minted for our OAuth client (the id_token "aud" claim).
          # Same bug workaround: mounted as env var by gcloud run deploy.
          audiences: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES}