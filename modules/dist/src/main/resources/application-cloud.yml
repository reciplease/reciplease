reciplease:
  jwt:
    signing-secret: ${RECIPLEASE_JWT_SIGNING_SECRET}
  webauthn:
    # The rpId must be a registrable domain suffix of the origin that actually serves the
    # sign-in UI (next.reciplease.org) — the apex domain works and lets app.reciplease.org
    # share the same passkeys if it ever needs to.
    rp-id: reciplease.org
    rp-name: Reciplease
    allowed-origins: https://next.reciplease.org