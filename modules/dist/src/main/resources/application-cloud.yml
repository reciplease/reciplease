reciplease:
  jwt:
    # Reciplease's own HS256 signing secret (also reused as the /api/auth/exchange
    # server-to-server shared secret). Injected via Cloud Run --set-secrets as
    # RECIPLEASE_JWT_SIGNING_SECRET; Spring Boot relaxed binding maps it automatically.
    signing-secret: ${RECIPLEASE_JWT_SIGNING_SECRET}
  webauthn:
    # The rpId must be a registrable domain suffix of the origin that actually serves the
    # sign-in UI (next.reciplease.org) — the apex domain works and lets app.reciplease.org
    # share the same passkeys if it ever needs to.
    rp-id: reciplease.org
    rp-name: Reciplease
    allowed-origins: https://next.reciplease.org
  fitbit:
    # Injected via Cloud Run --set-secrets as FITBIT_CLIENT_ID / FITBIT_CLIENT_SECRET;
    # Spring Boot relaxed binding maps them automatically.
    client-id: ${FITBIT_CLIENT_ID}
    client-secret: ${FITBIT_CLIENT_SECRET}
    redirect-uri: https://next.reciplease.org/api/fitbit/callback

spring:
  # Mongo URI is injected as SPRING_MONGODB_URI (spring.mongodb.uri, renamed from
  # spring.data.mongodb.uri in Spring Boot 4) via Cloud Run --set-secrets; Spring
  # Boot relaxed binding maps it automatically.