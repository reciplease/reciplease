spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Google's OIDC issuer; Spring fetches its public keys to validate tokens.
          issuer-uri: https://accounts.google.com
          # Audience is injected as SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES
          # and Mongo URI as SPRING_MONGODB_URI (spring.mongodb.uri, renamed from
          # spring.data.mongodb.uri in Spring Boot 4) via Cloud Run --set-secrets;
          # Spring Boot relaxed binding maps them automatically.