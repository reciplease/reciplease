# Embedded MongoDB (flapdoodle) is auto-configured for tests.
# Spring Boot 4 removed its built-in embedded-mongo auto-configuration, so the
# flapdoodle spring3x starter now provides it and requires an explicit version.
de.flapdoodle.mongodb.embedded.version=7.0.14

# Spring Boot 4 no longer defaults the Mongo UUID representation; entities use UUIDs.
# Note: property renamed in Boot 4 (was spring.data.mongodb.uuid-representation).
spring.mongodb.representation.uuid=standard
