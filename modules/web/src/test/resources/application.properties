spring.jackson.default-property-inclusion=non_null

reciplease.version=test
reciplease.jwt.signing-secret=test-signing-secret-not-for-prod
reciplease.webauthn.rp-id=localhost
reciplease.webauthn.rp-name=Reciplease
reciplease.webauthn.allowed-origins=http://localhost:3000

# An async MongoDB topology-monitor thread started by some earlier test's real MongoClient
# bean (in the same Surefire JVM fork) repeatedly fails to connect and logs about it, even
# in tests with nothing to do with Mongo — harmless noise, quiet it here.
logging.level.org.mongodb.driver=OFF
logging.level.com.mongodb=OFF
