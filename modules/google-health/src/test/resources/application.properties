# Embedded MongoDB (flapdoodle) is auto-configured for tests.
# Spring Boot 4 removed its built-in embedded-mongo auto-configuration, so the
# flapdoodle spring4x starter now provides it and requires an explicit version.
# Kept close to the production Atlas version (8.0.24); 8.0.17 is the newest
# 8.0.x build flapdoodle has a downloadable package for.
de.flapdoodle.mongodb.embedded.version=8.0.17

# Spring Boot 4 no longer defaults the Mongo UUID representation.
# (Property was renamed from spring.data.mongodb.uuid-representation.)
spring.mongodb.representation.uuid=standard
